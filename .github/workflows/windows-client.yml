name: Build WEL Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  N2N_VERSION: 3.0

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download official n2n source archive
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.n2n-build' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path '.n2n-build' -Force | Out-Null
          $archivePath = Join-Path '.n2n-build' 'n2n.zip'
          $sourceUrl = "https://codeload.github.com/ntop/n2n/zip/refs/tags/$env:N2N_VERSION"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath '.n2n-build'
          $sourceDirectory = Get-ChildItem '.n2n-build' -Directory |
            Where-Object { $_.Name -like 'n2n-*' -and $_.Name -ne 'source' } |
            Select-Object -First 1
          if ($null -eq $sourceDirectory) {
            throw '未找到解压后的 n2n 源码目录'
          }
          Rename-Item -Path $sourceDirectory.FullName -NewName 'source'
      - name: Install MSYS2 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
      - name: Build n2n edge from official source
        shell: msys2 {0}
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf .n2n-build/build
          cmake -S .n2n-build/source -B .n2n-build/build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build .n2n-build/build --target edge -- -j2
          test -f .n2n-build/build/edge.exe
          cp .n2n-build/build/edge.exe frontend/resources/n2n/edge.exe
          cp .n2n-build/source/LICENSE frontend/resources/n2n/n2n-LICENSE.txt
          cat > frontend/resources/n2n/n2n-source-notice.txt <<EOF
          WEL n2n runtime source notice

          Source: https://github.com/ntop/n2n
          Revision: ${N2N_VERSION}
          License: GNU General Public License, version 3 or later.

          The source corresponding to this binary is available at the source
          URL above under the pinned revision.
          EOF
          if test -f frontend/resources/n2n/fonta0.exe; then
            echo "fonta0.exe must never be packaged"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Test Electron helpers
        run: npm run test:electron
      - name: Check Windows PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { throw 'Windows PowerShell 脚本语法检查失败' }
      - name: Build frontend
        run: npm run build
      - name: Check release runtime
        shell: pwsh
        run: |
          $required = @(
            'resources/n2n/edge.exe',
            'resources/n2n/n2n-LICENSE.txt',
            'resources/n2n/n2n-source-notice.txt',
            'resources/openvpn/bin/tapctl.exe',
            'build/tap-windows-9.21.2.exe'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "缺少安装包运行时文件，无法生成 Windows 安装包: $($missing -join ', ')"
          }
          if (Test-Path 'resources/n2n/fonta0.exe') {
            throw '禁止将 fonta0.exe 打进 WEL 安装包'
          }
      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wel-windows-win7-nsis
          path: frontend/release/WEL职业联盟对战平台-*-安装包.exe
          if-no-files-found: error
          retention-days: 14
