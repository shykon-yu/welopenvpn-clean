name: Build WEL Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  N2N_VERSION: "3.0"
  N2N_PORT: 22222

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build n2n edge from official source
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "third_party/n2n/n2n-$env:N2N_VERSION.zip"
          if (-not (Test-Path $archive)) { throw "Missing n2n source archive: $archive" }
          Remove-Item .n2n-build -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath .n2n-build
          Move-Item ".n2n-build/n2n-$env:N2N_VERSION" .n2n-build/source
          cmake -S .n2n-build/source -B .n2n-build/build `
            -DN2N_OPTION_USE_PTHREAD=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DCMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build .n2n-build/build --config Release --target edge --parallel 2
          $edge = '.n2n-build/build/Release/edge.exe'
          if (-not (Test-Path $edge)) { throw "n2n edge build output missing: $edge" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found; cannot verify edge runtime dependencies' }
          $dependencies = (& $dumpbin.FullName /dependents $edge | Out-String)
          Write-Host $dependencies
          if ($dependencies -match '(?i)VCRUNTIME\d*\.dll|MSVCP\d*\.dll|UCRTBASE\.dll|api-ms-win-crt') {
            throw 'edge.exe still depends on a dynamic Visual C++ runtime; green editions would fail with 0xC0000135'
          }
          Copy-Item $edge frontend/resources/welhelper/edge.exe -Force
          Copy-Item .n2n-build/source/COPYING frontend/resources/welhelper/n2n-LICENSE.txt -Force
          if (Test-Path frontend/resources/welhelper/fonta0.exe) { throw 'fonta0.exe must never be packaged' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build game broadcast helpers
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $compatArchive = 'third_party/windivert/WinDivert-1.4.3-A.zip'
          $modernArchive = 'third_party/windivert/WinDivert-2.2.2-A.zip'
          if (-not (Test-Path $compatArchive)) { throw "Missing WinDivert archive: $compatArchive" }
          if (-not (Test-Path $modernArchive)) { throw "Missing WinDivert archive: $modernArchive" }

          Remove-Item .windivert-build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item .windivert-build -ItemType Directory | Out-Null
          Expand-Archive -LiteralPath $compatArchive -DestinationPath .windivert-build/compat
          Expand-Archive -LiteralPath $modernArchive -DestinationPath .windivert-build/modern

          function Build-WelBroadcastHelper($sourceRoot, $architecture, $outputDirectory, $modern) {
            New-Item $outputDirectory -ItemType Directory -Force | Out-Null
            $defines = @()
            if ($modern) { $defines += '/DWEL_WINDIVERT_V2=1' }
            & cl.exe /nologo /W4 /O2 /MT /D_CRT_SECURE_NO_WARNINGS @defines `
              native/wel-broadcast/wel_broadcast.c `
              "/I$sourceRoot/include" `
              "/Fe:$outputDirectory/welnet.exe" `
              /link "/LIBPATH:$sourceRoot/$architecture" WinDivert.lib
            if ($LASTEXITCODE -ne 0) { throw "welnet.exe build failed for $sourceRoot" }
            Copy-Item "$sourceRoot/$architecture/WinDivert.dll" $outputDirectory -Force
            Copy-Item "$sourceRoot/$architecture/WinDivert64.sys" $outputDirectory -Force
            Copy-Item "$sourceRoot/LICENSE" "$outputDirectory/WinDivert-LICENSE.txt" -Force
          }

          Build-WelBroadcastHelper `
            '.windivert-build/compat/WinDivert-1.4.3-A' `
            'x86_64' `
            'frontend/resources/welhelper/net-compat' `
            $false
          Build-WelBroadcastHelper `
            '.windivert-build/modern/WinDivert-2.2.2-A' `
            'x64' `
            'frontend/resources/welhelper/net-modern' `
            $true

          & frontend/resources/welhelper/net-compat/welnet.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'WinDivert 1.4 helper self-test failed' }
          & frontend/resources/welhelper/net-modern/welnet.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'WinDivert 2.2 helper self-test failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Test Electron helpers
        working-directory: frontend
        run: npm run test:electron
      - name: Check Windows PowerShell scripts
        shell: pwsh
        working-directory: frontend
        run: |
          $failed = $false
          Get-ChildItem build -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { throw 'Windows PowerShell 脚本语法检查失败' }
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check release runtime
        shell: pwsh
        working-directory: frontend
        run: |
          $required = @(
            '../third_party/n2n/n2n-3.0.zip',
            'resources/welhelper/edge.exe',
            'resources/welhelper/n2n-LICENSE.txt',
            'resources/welhelper/n2n-source-notice.txt',
            'resources/welhelper/net-compat/welnet.exe',
            'resources/welhelper/net-compat/WinDivert.dll',
            'resources/welhelper/net-compat/WinDivert64.sys',
            'resources/welhelper/net-compat/WinDivert-LICENSE.txt',
            'resources/welhelper/net-modern/welnet.exe',
            'resources/welhelper/net-modern/WinDivert.dll',
            'resources/welhelper/net-modern/WinDivert64.sys',
            'resources/welhelper/net-modern/WinDivert-LICENSE.txt',
            'resources/openvpn/bin/tapctl.exe',
            'build/tap-windows-9.21.2.exe'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "缺少安装包运行时文件，无法生成 Windows 安装包: $($missing -join ', ')"
          }
          if (Test-Path 'resources/welhelper/fonta0.exe') {
            throw '禁止将 fonta0.exe 打进 WEL 安装包'
          }
      - name: Build NSIS installer
        working-directory: frontend
        run: npx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wel-windows-win7-nsis
          path: frontend/release/WEL职业联盟对战平台-*-安装包.exe
          if-no-files-found: error
          retention-days: 14
